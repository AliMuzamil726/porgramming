<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unknown Search Engine</title>
<style>
    /* Full-page dark blue theme */
    body {
        margin: 0;
        padding: 0;
        font-family: 'Courier New', Courier, monospace;
        background: linear-gradient(135deg, #001f3f, #004080);
        color: #00ffcc;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }

    /* Title styling */
    h1 {
        margin-top: 50px;
        font-size: 3em;
        text-shadow: 0 0 15px #00ffcc, 0 0 30px #00ffcc;
        text-align: center;
    }

    /* Container for search box */
    .search-container {
        width: 90%;
        max-width: 700px;
        margin-top: 50px;
        background-color: rgba(0,0,0,0.7);
        padding: 40px 30px;
        border-radius: 12px;
        box-shadow: 0 0 30px #00ffcc;
    }

    /* Google Custom Search box styling */
    .gcse-search {
        width: 100%;
    }

    /* Custom override for input box */
    input.gsc-input {
        background: #001f3f !important;
        color: #00ffcc !important;
        border: 2px solid #00ffcc !important;
        border-radius: 6px !important;
        padding: 12px !important;
        font-size: 16px !important;
        box-shadow: 0 0 10px #00ffcc !important;
        outline: none !important;
        width: calc(100% - 30px) !important;
    }

    input.gsc-input:focus {
        border-color: #00ffcc !important;
        box-shadow: 0 0 20px #00ffcc !important;
    }

    input.gsc-search-button {
        background-color: #001f3f !important;
        color: #00ffcc !important;
        border: 2px solid #00ffcc !important;
        border-radius: 6px !important;
        padding: 12px 20px !important;
        cursor: pointer !important;
        font-weight: bold !important;
        box-shadow: 0 0 10px #00ffcc !important;
    }

    input.gsc-search-button:hover {
        box-shadow: 0 0 20px #00ffcc !important;
    }

    /* Search results styling */
    .gsc-results-wrapper-visible {
        background-color: rgba(0,0,0,0.9) !important;
        border-radius: 12px !important;
        box-shadow: 0 0 20px #00ffcc !important;
        padding: 20px !important;
    }

    .gsc-thumbnail-inside {
        display: none !important; /* hide thumbnails for cleaner hacker look */
    }

    .gsc-url-top, .gs-title {
        color: #00ffcc !important;
    }

    .gsc-webResult.gsc-result {
        border-bottom: 1px dashed #00ffcc !important;
        padding: 12px 0 !important;
    }
</style>
</head>
<body>
    <h1>Unknown</h1>

    <div class="search-container">
        <!-- Google Custom Search Element -->
        <script async src="https://cse.google.com/cse.js?cx=d05cfdd68352943d3"></script>
        <div class="gcse-search"></div>
    </div>
</body>
</html>
